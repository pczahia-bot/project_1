workflows:
  flutter-apk-workflow:
    name: Flutter APK Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          source: true
    scripts:
      - name: Get Flutter packages
        script: flutter packages get

      - name: Print Android SHA-1 Key
        script: |
          cd android
          ./gradlew signingReport

      - name: Build APK Release
        script: flutter build apk --release
        
    artifacts:
      - build/**/outputs/**/*.apk